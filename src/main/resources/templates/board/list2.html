<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout1.html}">

<div layout:fragment="content">

    <h1>Board List</h1>

    <table border="1">
        <tr>
            <th>Bno</th><th>Title</th><th>Writer</th><th>RegDate</th>
        </tr>
        <tr th:each="dto : ${result.content}">
            <td th:text="${dto.bno}"></td>
            <td th:text="${dto.title}"></td>
            <td th:text="${dto.writer}"></td>
            <td th:text="${#temporals.format(dto.regDate,
                          'yyyy-MM-dd')}"></td>
        </tr>
    </table>

    <p th:text="|전체 ${result.totalElements} 건 /
                 ${result.totalPages} 페이지|"></p>

</div>
</html>
